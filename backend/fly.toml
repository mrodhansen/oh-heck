# Optional permanent API host (Fly.io).
# After: fly auth login && fly postgres create && fly apps create oh-heck-api
# Set DATABASE_URL secret, then: fly deploy --config backend/fly.toml --dockerfile backend/Dockerfile

app = "oh-heck-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  CORS_ORIGIN = "*"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
